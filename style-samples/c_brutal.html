<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;900&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#4D6BFE;font-family:'Noto Sans SC',sans-serif;color:#111;position:relative;overflow:hidden}
.mono{font-family:'Space Mono',monospace}
.box{border:6px solid #111;box-shadow:12px 12px 0 #111;border-radius:18px}
.tag{position:absolute;top:110px;left:80px;background:#FFE14D;padding:12px 26px;font-size:32px;font-weight:900}
.num{position:absolute;top:110px;right:80px;background:#fff;padding:12px 26px;font-size:32px}
.title{position:absolute;top:250px;left:80px;right:80px;background:#fff;padding:40px 50px}
.title h1{font-size:170px;font-weight:900;line-height:1}
.title p{font-size:38px;font-weight:500;margin-top:16px}
.stage{position:absolute;top:640px;left:80px;right:80px;background:#FFF6D6;padding:46px 40px}
.row{display:flex;gap:14px;flex-wrap:nowrap}
.t{border:5px solid #111;border-radius:12px;font-size:42px;font-weight:900;padding:18px 20px;background:#fff}
.t.d{background:#FFE14D}
.t.ok{background:#3DDC84}
.t.no{background:#FF5C5C;color:#fff;text-decoration:line-through}
.step{font-size:32px;font-weight:900;margin:26px 0 18px}
.big{position:absolute;top:1300px;left:80px;background:#FF5C5C;color:#fff;padding:28px 40px;font-size:64px;font-weight:900;transform:rotate(-3deg)}
.chip{position:absolute;top:1510px;left:80px;background:#111;color:#FFE14D;padding:16px 26px;font-size:28px;border-radius:12px}
.cap{position:absolute;bottom:200px;left:80px;right:80px;background:#fff;text-align:center;padding:26px;font-size:42px;font-weight:900}
</style></head><body>
<div class="tag box">DeepInfer 看家本领</div>
<div class="num box mono">01/03</div>
<div class="title box"><h1>猜着写！</h1><p>推测解码 <span class="mono">Speculative Decoding</span></p></div>
<div class="stage box">
 <div class="step" style="margin-top:0">① 先猜 5 个</div>
 <div class="row"><div class="t d">天气</div><div class="t d">真</div><div class="t d">不错</div><div class="t d">，</div><div class="t d">去</div></div>
 <div class="step">② 一次验证</div>
 <div class="row"><div class="t ok">天气</div><div class="t ok">真</div><div class="t ok">不错</div><div class="t ok">，</div><div class="t no">去</div></div>
</div>
<div class="big box">一步顶四步 ⚡</div>
<div class="chip mono box">DEEPINFER_ENABLE_MTP_VARLEN=1</div>
<div class="cap box">先打几个草稿 token，再一次性验证</div>
</body></html>
